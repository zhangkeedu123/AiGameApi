name: jinyao

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.docker}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env.docker}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      UPLOAD_DIR: /data/uploads
      ERROR_LOG: /data/logs/errors.log
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${API_LISTEN_HOST:-127.0.0.1}:${API_PORT:-8000}:80001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${API_STATE_DIR:-/srv/jinyao/api}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
